AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CouchJarvis serverless relay. API Gateway WebSocket + Lambda (Python 3.12) + DynamoDB (on-demand, TTL).
  Phones and the PC daemon exchange typed envelopes through it; no accounts, no servers.
  Deploy:  sam build && sam deploy --guided   (then put the WebSocketUrl output in CJ_RELAY_WS_URL)

Parameters:
  StageName:
    Type: String
    Default: prod
    AllowedPattern: "[a-z][a-z0-9]{1,15}"
  LogRetentionDays:
    Type: Number
    Default: 3
    Description: CloudWatch log retention. Kept short so logs never leave the free tier.
  BudgetEmail:
    Type: String
    Default: ""
    Description: Optional. If set, budget and health alarms email this address.
  MonthlyBudgetUsd:
    Type: Number
    Default: 25
    Description: Monthly budget. Emails at 80% of actual spend and when the month's forecast passes 100%.
  ThrottleRatePerSecond:
    Type: Number
    Default: 500
    Description: Messages per second for ALL customers together (each PC/phone also has its own limits).
  ThrottleBurst:
    Type: Number
    Default: 1000
  ReservedConcurrency:
    Type: Number
    Default: 0
    Description: Optional cost ceiling on the message router (0 = no reservation). Needs spare account concurrency.

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    CodeUri: lambdas/
    Environment:
      Variables:
        ROOMS_TABLE: !Ref RoomsTable
        CONNECTIONS_TABLE: !Ref ConnectionsTable
        DEVICES_TABLE: !Ref DevicesTable
        IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        CONFIG_TABLE: !Ref ConfigTable
        LOG_LEVEL: INFO

Resources:
  # ------------------------------------------------------------------ DynamoDB (on-demand, always-free tier friendly)
  RoomsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: room_id
          AttributeType: S
      KeySchema:
        - AttributeName: room_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      # A room whose PC has not connected for 400 days is removed (the PC refreshes it on connect).
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
        - AttributeName: room_id
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: room-index
          KeySchema:
            - AttributeName: room_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  DevicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: room_id
          AttributeType: S
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: room_id
          KeyType: HASH
        - AttributeName: device_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Idempotency keys, and the per-IP rate-limit counters ("rate#..." keys); both expire by TTL.
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Holds the per-deployment master secret (created on first use by the relay).
  ConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # ------------------------------------------------------------------ WebSocket API
  RelayApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-relay"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.type"

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RelayApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations"

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RelayApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations"

  RouterIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RelayApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RouterFunction.Arn}/invocations"

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RelayApi
      RouteKey: $connect
      AuthorizationType: NONE # the handler authenticates (pc_key header / device JWT / pairing)
      Target: !Sub "integrations/${ConnectIntegration}"

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RelayApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${DisconnectIntegration}"

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RelayApi
      RouteKey: $default
      Target: !Sub "integrations/${RouterIntegration}"

  RelayStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref RelayApi
      StageName: !Ref StageName
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRatePerSecond
        ThrottlingBurstLimit: !Ref ThrottleBurst
        DataTraceEnabled: false # never log message bodies (they carry tokens)
        LoggingLevel: "OFF"
    DependsOn: [ConnectRoute, DisconnectRoute, DefaultRoute]

  # ------------------------------------------------------------------ Lambdas
  ConnectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  DisconnectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  RouterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: connect_handler.handler
      Description: WebSocket $connect - authenticates PCs (pc_key) and phones (device JWT / pairing)
      LoggingConfig:
        LogGroup: !Ref ConnectLogGroup
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RoomsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
        - DynamoDBReadPolicy: { TableName: !Ref ConnectionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DevicesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConfigTable }
        - DynamoDBCrudPolicy: { TableName: !Ref IdempotencyTable } # per-IP rate-limit counters
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${ConnectionsTable.Arn}/index/room-index"
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RelayApi}/${StageName}/*/@connections/*"

  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: disconnect_handler.handler
      Description: WebSocket $disconnect - prunes the connection and broadcasts presence
      LoggingConfig:
        LogGroup: !Ref DisconnectLogGroup
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RoomsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
        - DynamoDBReadPolicy: { TableName: !Ref DevicesTable }
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${ConnectionsTable.Arn}/index/room-index"
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RelayApi}/${StageName}/*/@connections/*"

  RouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: relay_router.handler
      Description: WebSocket $default - pairing, command relay (phone to PC) and fan-out (PC to phones)
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref RouterLogGroup
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RoomsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DevicesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref IdempotencyTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConfigTable }
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${ConnectionsTable.Arn}/index/room-index"
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RelayApi}/${StageName}/*/@connections/*"

  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RelayApi}/*/$connect"

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RelayApi}/*/$disconnect"

  RouterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RouterFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RelayApi}/*/$default"

  # ------------------------------------------------------------------ Cost guard and health alarms (optional)
  CostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasBudgetEmail
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref BudgetEmail

  # Customers notice a broken relay before you do: these email you first.
  RouterErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBudgetEmail
    Properties:
      AlarmDescription: The message router is failing (Lambda errors)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref RouterFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ConnectErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBudgetEmail
    Properties:
      AlarmDescription: Connections are failing (Lambda errors in $connect)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ConnectFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  RouterThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBudgetEmail
    Properties:
      AlarmDescription: The message router is being throttled (raise concurrency or ReservedConcurrency)
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: !Ref RouterFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBudgetEmail
    Properties:
      AlarmDescription: API Gateway is returning server errors to customers
      Namespace: AWS/ApiGateway
      MetricName: IntegrationError
      Dimensions:
        - { Name: ApiId, Value: !Ref RelayApi }
        - { Name: Stage, Value: !Ref StageName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  WebSocketUrl:
    Description: Put this in the daemon's CJ_RELAY_WS_URL and the PWA's VITE_RELAY_WS_URL
    Value: !Sub "wss://${RelayApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
