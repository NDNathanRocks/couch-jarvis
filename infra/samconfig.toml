version = 0.1

[default.global.parameters]
stack_name = "couch-jarvis"
region = "us-east-2"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
region = "us-east-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
# Optional: parameter_overrides = "BudgetEmail=you@example.com"
